# Dependency updates for core-geth-website.
#
# VERSION UPDATES ARE OFF, DELIBERATELY. Maintainer decision, 2026-09-17: the
# config is wired so the ecosystems are on record, and held at zero pull
# requests so it opens none.
#
# `open-pull-requests-limit: 0` is GitHub's documented mechanism for disabling
# version updates for an ecosystem while keeping the configuration visible. The
# state below is a decision, not an oversight: do not "fix" it into an active
# config.
#
# WHAT THE TWO ENTRIES NAME
#   npm             The site's package.json and pnpm-lock.yaml at the repository
#                   root. pnpm has no ecosystem key of its own and resolves under
#                   "npm". This file was written before the site, so until that
#                   manifest lands this entry has nothing to read.
#   github-actions  The workflows under .github/workflows. For this ecosystem the
#                   directory is "/", and Dependabot searches .github/workflows
#                   from there.
#
# WHY OFF
#   Nobody is assigned to triage a standing pull-request queue here, and a queue
#   nobody reads reports itself as a control while operating as noise.
#
# WHAT THIS DOES NOT DO
#   Dependabot SECURITY updates are a repository setting with no key in this
#   file. Nothing written here turns them on or off, and a limit of zero does not
#   withhold them: their pull requests are not subject to this limit and do not
#   count toward it. GitHub sets no limit on security-update pull requests at
#   all. The maintainer wants no Dependabot pull requests here, which holds only
#   while that setting is off: turning it on opens security pull requests
#   whatever this file says. Read the repository setting itself rather than
#   inferring it from this file; anyone with admin access can change it.
#
# WHAT WOULD CHANGE IT
#   Someone taking ownership of the queue. Raising a limit brings a `cooldown:`
#   block to every entry: default-days 7, plus semver-major-days 21 on npm.
#   github-actions supports default-days but not the SemVer-bump keys, so
#   semver-major-days there is a key nothing reads. There is no cooldown here
#   now on purpose: at a limit of zero it would gate nothing, and an inert
#   setting reads as a control that is operating.
#
# UNAFFECTED BY THIS FILE
#   Every action in the workflows is pinned to a full commit SHA, with the
#   release it resolves to in a trailing comment. That pin is the control in
#   force against a repointed tag, and bumping it stays a reviewed workflow
#   change.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
