name: Guides, install

# Runs the install guide's commands, as the built pages give them, on the systems its tabs name: the Linux
# distributions in containers, a Linux runner for the systemd service and for Arm64, macOS on Apple Silicon
# and on Intel, Windows, and Docker. The dark band's start from the committed records serves a node on either
# line, so it runs here too. tests/guides/README.md says what each job runs and what it skips.
#
# Run it by hand when the guides change, from the Actions tab or with
#   gh workflow run guides-install.yml --ref <branch>

on:
  workflow_dispatch:
  # A dispatch needs the workflow on the default branch, so its first runs come from this push trigger.
  # Remove it before the merge.
  push:
    branches:
      - feat/guide-ci

# The jobs download and run what the guides tell a reader to, and need nothing but read access to do it.
permissions:
  contents: read

concurrency:
  group: guides-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build the pages and bundle their blocks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bundle the blocks
        run: python3 tests/guides/blocks.py dist bundle

      - name: Check every address the blocks fetch
        run: python3 tests/guides/urls.py bundle

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: bundle
          retention-days: 7

  linux:
    name: Linux, ${{ matrix.distro }}${{ matrix.source && ', from source' || '' }}
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, rocky, arch]
        source: [false, true]
        include:
          - distro: debian
            image: "debian:13"
          - distro: ubuntu
            image: "ubuntu:24.04"
          - distro: fedora
            image: "fedora:latest"
          - distro: rocky
            image: "rockylinux/rockylinux:9"
          - distro: arch
            image: "archlinux:latest"
    env:
      BUNDLE: ${{ github.workspace }}/bundle
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ matrix.image }}
      DISTRO: ${{ matrix.distro }}
      SCENARIO: ${{ matrix.source && 'install/source-linux.sh' || 'install/linux.sh' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle

      - name: Run the Linux tab in a fresh container
        run: bash tests/guides/in-container.sh "$IMAGE" "$SCENARIO" "$DISTRO"

  runner:
    name: ${{ matrix.name }}
    needs: bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux service, x86-64"
            runner: ubuntu-24.04
            run: "bash tests/guides/install/linux-service.sh x86-64"
          - name: "Linux service, Arm64"
            runner: ubuntu-24.04-arm
            run: "bash tests/guides/install/linux-service.sh arm64"
          - name: "Containers, x86-64"
            runner: ubuntu-24.04
            run: "bash tests/guides/install/containers.sh x86-64"
          - name: "Containers, Arm64"
            runner: ubuntu-24.04-arm
            run: "bash tests/guides/install/containers.sh arm64"
          - name: "macOS, Apple Silicon"
            runner: macos-15
            run: "zsh tests/guides/install/macos.sh apple-silicon"
          - name: "macOS, Intel"
            runner: macos-15-intel
            run: "zsh tests/guides/install/macos.sh intel"
          - name: "macOS, Apple Silicon, from source"
            runner: macos-15
            run: "zsh tests/guides/install/source-macos.sh apple-silicon"
          - name: "macOS, Intel, from source"
            runner: macos-15-intel
            run: "zsh tests/guides/install/source-macos.sh intel"
    env:
      BUNDLE: ${{ github.workspace }}/bundle
      GH_TOKEN: ${{ github.token }}
      SCENARIO: ${{ matrix.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle

      - name: Run the scenario
        run: $SCENARIO

  windows:
    name: Windows${{ matrix.source && ', from source' || '' }}
    needs: bundle
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [false, true]
    env:
      BUNDLE: ${{ github.workspace }}\bundle
      GH_TOKEN: ${{ github.token }}
      SCENARIO: ${{ matrix.source && 'tests\guides\install\windows-source.ps1' || 'tests\guides\install\windows.ps1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle

      - name: Run the scenario in Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:SCENARIO
          exit $LASTEXITCODE
